<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e1e">
    <title>Airpad controller</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
            color: #eee;
            font-family: system-ui, sans-serif;
        }
        #status {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: grid;
            place-items: center;
            padding: 16px;
            text-align: center;
            background: #1e1e1ee0;
        }
        #status[hidden] {
            display: none;
        }
    </style>
</head>
<body>
<div id="status">Connecting…</div>

<script type="module">
import { join, createController, Events } from "../src/index.js";

const status = document.getElementById("status");
const show = (message) => {
    status.textContent = message;
    status.hidden = false;
};

const id = location.hash.slice(1);
if (!id) {
    show("Scan the QR code shown on the screen");
}
else {
    try {
        const server = new URLSearchParams(location.search).get("server") ?? undefined;
        const pad = await join(id, { server });
        status.hidden = true;
        createController(pad);
        pad.addEventListener(Events.CLOSE, () => show("Disconnected. Scan the QR code again to reconnect."));
    }
    catch (error) {
        console.error(error);
        show(error.message.replace(/^Airpad: /, ""));
    }
}
</script>
</body>
</html>
