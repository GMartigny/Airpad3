<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Airpad3 – controller</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background: #262626;
            color: #eee;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        #status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 16px;
        }
        .pad {
            display: flex;
            height: 100%;
        }
        .arrows, .buttons {
            flex: 1;
            padding: 16px;
        }
        .arrows {
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            gap: 4px;
            aspect-ratio: 1;
            max-height: 100%;
            align-self: center;
        }
        .arrows [data-name="Up"] { grid-area: 1 / 2; }
        .arrows [data-name="Left"] { grid-area: 2 / 1; }
        .arrows [data-name="Right"] { grid-area: 2 / 3; }
        .arrows [data-name="Down"] { grid-area: 3 / 2; }
        .buttons {
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        button {
            border: none;
            font: bold 1.5em system-ui, sans-serif;
            color: #eee;
            background: #111;
        }
        .buttons button {
            width: 35%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #C9211E;
        }
        button.pressed {
            filter: brightness(1.4);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div id="status">Connecting…</div>
<div class="pad hidden">
    <div class="arrows">
        <button data-name="Up">▲</button>
        <button data-name="Left">◀</button>
        <button data-name="Right">▶</button>
        <button data-name="Down">▼</button>
    </div>
    <div class="buttons">
        <button data-name="B">B</button>
        <button data-name="A">A</button>
    </div>
</div>

<script type="module">
import { join } from "../../src/index.js";

const status = document.getElementById("status");
const id = location.hash.slice(1);

if (!id) {
    status.textContent = "Scan the QR code shown on the display";
}
else {
    try {
        const pad = await join(id);
        status.classList.add("hidden");
        document.querySelector(".pad").classList.remove("hidden");

        pad.addEventListener("vibrate", ({ detail: duration }) => {
            navigator.vibrate?.(duration);
        });
        pad.addEventListener("close", () => {
            status.textContent = "Display disconnected";
            status.classList.remove("hidden");
        });

        const press = (button, pressed) => {
            if (button.classList.contains("pressed") === pressed || !pad.isOpen) {
                return;
            }
            button.classList.toggle("pressed", pressed);
            pad.send(pressed ? "buttondown" : "buttonup", button.dataset.name);
        };

        document.querySelectorAll("button").forEach((button) => {
            button.addEventListener("pointerdown", (event) => {
                button.setPointerCapture(event.pointerId);
                press(button, true);
            });
            ["pointerup", "pointercancel", "lostpointercapture"].forEach((eventName) => {
                button.addEventListener(eventName, () => press(button, false));
            });
            button.addEventListener("contextmenu", event => event.preventDefault());
        });
    }
    catch (error) {
        console.error(error);
        status.textContent = error.message;
    }
}
</script>
</body>
</html>
