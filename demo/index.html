<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airpad3 – display</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #eee;
        }
        main {
            position: relative;
        }
        canvas {
            display: block;
            background: #262626;
            border-radius: 8px;
            max-width: 100vw;
        }
        #join {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 140px;
            text-align: center;
            font-size: .85em;
            color: #eee;
        }
        #join svg {
            display: block;
            width: 100%;
            height: auto;
            background: #fff;
            padding: 6px;
            border-radius: 6px;
            box-sizing: border-box;
        }
        #join p {
            margin: 6px 0 0;
        }
    </style>
</head>
<body>
<main>
    <canvas id="game" width="800" height="500"></canvas>
    <a id="join" target="_blank">
        <span id="qr"></span>
        <p id="status">Creating session…</p>
    </a>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
        integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k"
        crossorigin="anonymous"></script>
<!-- The lib imports Whiskers.js by package name: resolve it without a bundler -->
<script type="importmap">
{
    "imports": {
        "@gmartigny/whiskers.js": "https://cdn.jsdelivr.net/npm/@gmartigny/whiskers.js@2.0.0/dist/index.js"
    },
    "integrity": {
        "https://cdn.jsdelivr.net/npm/@gmartigny/whiskers.js@2.0.0/dist/index.js": "sha384-knaqvkSiCVElr3WfHyAiH65GezRNkBf6KUHPLOMNHjmSTfH0qun7/nO3AXpJ0vlJ"
    }
}
</script>
<script type="module">
import { host, Events, VibrateEvent } from "../src/index.js";

const status = document.getElementById("status");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// The controller page is "controller.html", next to this page
const session = await host();

const qr = qrcode(0, "M");
qr.addData(session.url);
qr.make();
document.getElementById("qr").innerHTML = qr.createSvgTag({ scalable: true });
document.getElementById("join").href = session.url;
status.textContent = "Scan to join";

// Mini-game: each player moves a square with the stick, A flashes, B boosts
const colors = ["#C9211E", "#2E86DE", "#10AC84", "#F6B93B", "#9B59B6", "#E67E22"];
const players = new Map();
const speed = 5;
const size = 40;

/**
 * @param {Peer} controller -
 * @return {Object}
 */
const playerOf = (controller) => {
    if (!players.has(controller.number)) {
        players.set(controller.number, {
            number: controller.number,
            x: 60 + ((controller.number - 1) % 6) * 110,
            y: 220,
            color: colors[(controller.number - 1) % colors.length],
            stick: { x: 0, y: 0 },
            keys: new Set(),
            flash: 0,
            connected: true,
            paused: false,
            orientation: "landscape",
        });
    }
    return players.get(controller.number);
};
const release = (player) => {
    player.keys.clear();
    player.stick = { x: 0, y: 0 };
};

session.addEventListener(Events.CONNECT, ({ controller }) => {
    playerOf(controller).connected = true;
});
session.addEventListener(Events.DISCONNECT, ({ controller, detail }) => {
    // A kicked player's place (and number) is freed
    if (detail.reason === "kicked") {
        players.delete(controller.number);
        return;
    }
    const player = playerOf(controller);
    player.connected = false;
    release(player);
});

session.addEventListener(Events.BUTTON_DOWN, ({ controller, button }) => {
    const player = playerOf(controller);
    player.keys.add(button);
    if (button === "A") {
        player.flash = 10;
        controller.send(new VibrateEvent(Events.VIBRATE, { pattern: 30 }));
    }
});
session.addEventListener(Events.BUTTON_UP, ({ controller, button }) => {
    playerOf(controller).keys.delete(button);
});
session.addEventListener(Events.STICK_MOVE, ({ controller, x, y }) => {
    playerOf(controller).stick = { x, y };
});
session.addEventListener(Events.ROTATE, ({ controller, orientation }) => {
    playerOf(controller).orientation = orientation;
});
session.addEventListener(Events.LOCK, ({ controller }) => {
    const player = playerOf(controller);
    player.paused = true;
    release(player);
});
session.addEventListener(Events.UNLOCK, ({ controller }) => {
    playerOf(controller).paused = false;
});
session.addEventListener(Events.ERROR, ({ detail: error }) => {
    console.error(error);
});

function loop () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center";

    if (!players.size) {
        ctx.fillStyle = "#888";
        ctx.font = "24px system-ui, sans-serif";
        ctx.fillText("Waiting for players…", canvas.width / 2, canvas.height / 2);
    }

    players.forEach((player) => {
        const boost = player.keys.has("B") ? 2 : 1;
        player.x = Math.max(0, Math.min(canvas.width - size, player.x + player.stick.x * speed * boost));
        player.y = Math.max(0, Math.min(canvas.height - size, player.y + player.stick.y * speed * boost));
        player.flash = Math.max(0, player.flash - 1);

        ctx.globalAlpha = player.connected && !player.paused ? 1 : 0.3;
        ctx.fillStyle = player.flash ? "#fff" : player.color;
        ctx.fillRect(player.x, player.y, size, size);
        ctx.fillStyle = "#eee";
        ctx.font = "bold 14px system-ui, sans-serif";
        const label = !player.connected ? "left" :
            player.paused ? "locked" :
                player.orientation === "portrait" ? "rotate!" : `P${player.number}`;
        ctx.fillText(label, player.x + size / 2, player.y - 8);
        ctx.globalAlpha = 1;
    });

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
