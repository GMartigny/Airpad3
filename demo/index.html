<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airpad3 – display</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #eee;
        }
        #qr svg {
            width: 260px;
            height: 260px;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
        }
        canvas {
            background: #262626;
            border-radius: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<main>
    <div id="pairing">
        <p id="status">Creating session…</p>
        <a id="qr" target="_blank"></a>
    </div>
    <canvas id="game" class="hidden" width="640" height="400"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { host, Events, VibrateEvent } from "../src/index.js";

const status = document.getElementById("status");
const qrLink = document.getElementById("qr");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// The controller page is "controller.html", next to this page
const display = await host();

const qr = qrcode(0, "M");
qr.addData(display.url);
qr.make();
qrLink.innerHTML = qr.createSvgTag({ scalable: true });
qrLink.href = display.url;
status.textContent = "Scan this QR code with your phone";

// Mini-game: move a square with the stick, A changes its color, B boosts
const keys = new Set();
const stick = { x: 0, y: 0 };
const player = { x: 300, y: 180, size: 40, color: "#C9211E" };
const colors = ["#C9211E", "#2E86DE", "#10AC84", "#F6B93B"];
const speed = 6;

let running = false;
display.addEventListener(Events.OPEN, () => {
    document.getElementById("pairing").classList.add("hidden");
    canvas.classList.remove("hidden");
    if (!running) {
        running = true;
        requestAnimationFrame(loop);
    }
});

display.addEventListener(Events.BUTTON_DOWN, ({ button }) => {
    keys.add(button);
    if (button === "A") {
        player.color = colors[(colors.indexOf(player.color) + 1) % colors.length];
        display.send(new VibrateEvent(Events.VIBRATE, { pattern: 30 }));
    }
});

display.addEventListener(Events.BUTTON_UP, ({ button }) => {
    keys.delete(button);
});

display.addEventListener(Events.STICK_MOVE, ({ x, y }) => {
    stick.x = x;
    stick.y = y;
});

let paused = false;
let orientation = "landscape";
display.addEventListener(Events.ROTATE, (event) => {
    orientation = event.orientation;
});
display.addEventListener(Events.LOCK, () => {
    paused = true;
    keys.clear();
    stick.x = 0;
    stick.y = 0;
});
display.addEventListener(Events.UNLOCK, () => {
    paused = false;
});

// The session survives: the same QR code (or the controller page) reconnects
display.addEventListener(Events.CLOSE, () => {
    keys.clear();
    stick.x = 0;
    stick.y = 0;
    status.textContent = "Controller disconnected. Scan again, or reopen the controller page to resume.";
    canvas.classList.add("hidden");
    document.getElementById("pairing").classList.remove("hidden");
});

display.addEventListener(Events.ERROR, ({ detail: error }) => {
    status.textContent = error.message;
});

function loop () {
    if (paused) {
        keys.clear();
    }
    const boost = keys.has("B") ? 2 : 1;
    player.x += stick.x * speed * boost;
    player.y += stick.y * speed * boost;
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);

    const message = paused ? "Paused: phone locked" :
        orientation === "portrait" ? "Turn your phone to landscape" : "";
    if (message) {
        ctx.fillStyle = "#eee";
        ctx.font = "24px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(message, canvas.width / 2, 40);
    }
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
