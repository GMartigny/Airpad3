<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airpad3 – display</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #1a1a1a;
            color: #eee;
        }
        #qr svg {
            width: 260px;
            height: 260px;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
        }
        canvas {
            background: #262626;
            border-radius: 8px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<main>
    <div id="pairing">
        <p id="status">Creating session…</p>
        <a id="qr" target="_blank"></a>
    </div>
    <canvas id="game" class="hidden" width="640" height="400"></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import { host } from "../src/index.js";

const status = document.getElementById("status");
const qrLink = document.getElementById("qr");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const display = await host({
    controllerUrl: "remote/",
});

const qr = qrcode(0, "M");
qr.addData(display.url);
qr.make();
qrLink.innerHTML = qr.createSvgTag({ scalable: true });
qrLink.href = display.url;
status.textContent = "Scan this QR code with your phone";

// Mini-game: move a square with the D-pad, A changes its color, B boosts
const keys = new Set();
const player = { x: 300, y: 180, size: 40, color: "#C9211E" };
const colors = ["#C9211E", "#2E86DE", "#10AC84", "#F6B93B"];
const speed = 4;

display.on("open", () => {
    document.getElementById("pairing").classList.add("hidden");
    canvas.classList.remove("hidden");
    requestAnimationFrame(loop);
});

display.on("message", ({ name, state }) => {
    if (state === "down") {
        keys.add(name);
        if (name === "A") {
            player.color = colors[(colors.indexOf(player.color) + 1) % colors.length];
            display.send({ vibrate: 30 });
        }
    }
    else {
        keys.delete(name);
    }
});

display.on("close", () => {
    status.textContent = "Controller disconnected. Reload the page to play again.";
    canvas.classList.add("hidden");
    document.getElementById("pairing").classList.remove("hidden");
    qrLink.classList.add("hidden");
});

display.on("error", (error) => {
    status.textContent = error.message;
});

function loop () {
    const boost = keys.has("B") ? 2 : 1;
    if (keys.has("Up")) player.y -= speed * boost;
    if (keys.has("Down")) player.y += speed * boost;
    if (keys.has("Left")) player.x -= speed * boost;
    if (keys.has("Right")) player.x += speed * boost;
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
